name: One-time complete rule library import
on:
  push:
    branches: [import/full-rule-library-0087bb74]
    paths: [.github/workflows/import-full-library.yml]
permissions:
  contents: write
concurrency:
  group: one-time-complete-library-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'wjykyhhh/personal-magic'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Import the exact user-requested upstream version
        run: python3 scripts/sync.py --commit 0087bb74e91b335e17a79fd07a8514277f7d77b4
      - run: python3 scripts/rules.py check
      - run: python3 -m unittest discover -s tests -v
      - name: Save a verified candidate and remove the one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('upstream/lock.json').read_text())
          assert lock['rule_tree_sha'] == 'ed757c41f280ef6fff02f23ca9e3cd6449df6429'
          assert len(lock['files']) == 8841
          Path('.github/workflows/import-full-library.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upstream dist .github/workflows/import-full-library.yml
          git commit -m 'Import complete upstream rule library unchanged (8841 files)'
          test "$(git rev-parse HEAD:upstream/blackmatrix7/rule)" = 'ed757c41f280ef6fff02f23ca9e3cd6449df6429'
          git push origin HEAD:refs/heads/import/full-rule-library-ready
          cat .update-report.md >> "$GITHUB_STEP_SUMMARY"
