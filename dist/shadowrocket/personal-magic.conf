# personal-magic client adapter; upstream rule bytes are in dist/base/
# Custom extensions are disabled. Policy bindings/fallbacks are local choices.

[General]
dns-server = https://doh.pub/dns-query,https://dns.alidns.com/dns-query
fallback-dns-server = system
ipv6 = true
prefer-ipv6 = false
dns-direct-fallback-proxy = false
private-ip-answer = true
udp-policy-not-supported-behaviour = REJECT

[Rule]
RULE-SET,https://raw.githubusercontent.com/wjykyhhh/personal-magic/stable/dist/base/Shadowrocket/OpenAI/OpenAI.list,PROXY
RULE-SET,https://raw.githubusercontent.com/wjykyhhh/personal-magic/stable/dist/base/Shadowrocket/Twitter/Twitter.list,PROXY
RULE-SET,https://raw.githubusercontent.com/wjykyhhh/personal-magic/stable/dist/base/Shadowrocket/Telegram/Telegram.list,PROXY
DOMAIN-SET,https://raw.githubusercontent.com/wjykyhhh/personal-magic/stable/dist/base/Shadowrocket/Global/Global_Domain.list,PROXY
RULE-SET,https://raw.githubusercontent.com/wjykyhhh/personal-magic/stable/dist/base/Shadowrocket/Global/Global.list,PROXY
DOMAIN-SET,https://raw.githubusercontent.com/wjykyhhh/personal-magic/stable/dist/base/Shadowrocket/China/China_Domain.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/wjykyhhh/personal-magic/stable/dist/base/Shadowrocket/China/China.list,DIRECT
GEOIP,CN,DIRECT
FINAL,PROXY
